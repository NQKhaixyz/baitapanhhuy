[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rag-engine-y-khoa"
version = "0.1.0"
description = "Mini RAG engine hỏi–đáp guideline y khoa trên corpus JSONL nhỏ"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "google-genai>=1.0.0",
  "langgraph>=0.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rag_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
